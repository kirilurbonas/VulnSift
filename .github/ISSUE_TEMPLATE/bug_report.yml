name: Bug report
description: Something in VulnSift doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities in VulnSift itself must not be reported here.** See [SECURITY.md](https://github.com/kirilurbonas/VulnSift/blob/main/SECURITY.md).
        Please remove secrets, API keys and private code from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command you ran and the full output or traceback.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal scan file (or the scanner and command that produced it) helps a lot.
  - type: input
    id: version
    attributes:
      label: VulnSift version
      description: Output of `vulnsift --version`.
    validations:
      required: true
  - type: dropdown
    id: scanner
    attributes:
      label: Scan format
      options: [SARIF, Snyk, Semgrep, Trivy, Not applicable]
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and whether you run it locally, via the GitHub Action, or in other CI.
