[project]
name = "vulnsift"
version = "0.3.0"
description = "AI-powered vulnerability triage: turn scanner noise into actionable remediation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kiril Urbonas" }]
requires-python = ">=3.11"
keywords = ["security", "vulnerability", "triage", "sast", "sca", "sarif", "snyk", "semgrep", "trivy", "claude", "remediation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.7",
    "anthropic>=1.13,<2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]
dashboard = ["flask>=3.0", "waitress>=3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.15"]

[project.scripts]
vulnsift = "vulnsift.cli:main"

[project.urls]
Homepage = "https://github.com/kirilurbonas/VulnSift"
Repository = "https://github.com/kirilurbonas/VulnSift"
Changelog = "https://github.com/kirilurbonas/VulnSift/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "vulnsift" }]
include = [{ path = "vulnsift/dashboard/templates/*", format = ["sdist", "wheel"] }, { path = "vulnsift/dashboard/static/*", format = ["sdist", "wheel"] }]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
