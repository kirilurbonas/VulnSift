[project]
name = "vulnsift"
version = "0.3.0"
description = "AI-powered vulnerability triage: turn scanner noise into actionable remediation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kiril Urbonas" }]
requires-python = ">=3.11"
keywords = ["security", "vulnerability", "triage", "sast", "sca", "sarif", "snyk", "semgrep", "trivy", "claude", "remediation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.7",
    "anthropic>=1.13,<2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]
dashboard = ["flask>=3.0", "waitress>=3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.15", "mypy>=1.11", "types-PyYAML>=6.0", "pip-audit>=2.7", "pre-commit>=3.8"]

[project.scripts]
vulnsift = "vulnsift.cli:main"

[project.urls]
Homepage = "https://github.com/kirilurbonas/VulnSift"
Repository = "https://github.com/kirilurbonas/VulnSift"
Changelog = "https://github.com/kirilurbonas/VulnSift/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "vulnsift" }]
include = [{ path = "vulnsift/dashboard/templates/*", format = ["sdist", "wheel"] }, { path = "vulnsift/dashboard/static/*", format = ["sdist", "wheel"] }]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["click.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["vulnsift"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["vulnsift"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["waitress", "waitress.*", "dotenv"]
ignore_missing_imports = true
