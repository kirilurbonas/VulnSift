<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VulnSift Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root { --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --text: #e4e4e7; --muted: #71717a; --accent: #8b5cf6; --red: #ef4444; --orange: #f97316; --green: #22c55e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
  h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--muted); margin-bottom: 2rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
  .card h2 { font-size: 0.875rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
  .stat { font-size: 2rem; font-weight: 700; }
  .stat.red { color: var(--red); }
  .stat.orange { color: var(--orange); }
  .stat.green { color: var(--green); }
  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .chart-card h2 { font-size: 1rem; margin-bottom: 1rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
  .risk-badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-weight: 600; font-size: 0.75rem; }
  .risk-high { background: rgba(239,68,68,0.15); color: var(--red); }
  .risk-med { background: rgba(249,115,22,0.15); color: var(--orange); }
  .risk-low { background: rgba(34,197,94,0.15); color: var(--green); }
  .empty { text-align: center; padding: 3rem; color: var(--muted); }
  .two-col { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; }
  @media (max-width: 768px) { .two-col { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <h1><span>VulnSift</span> Dashboard</h1>
  <p class="subtitle">Scan history, risk trends, and remediation progress</p>

  <div class="grid" id="stats-grid">
    <div class="card"><h2>Total Scans</h2><div class="stat" id="stat-scans">-</div></div>
    <div class="card"><h2>Highest Risk</h2><div class="stat red" id="stat-max-risk">-</div></div>
    <div class="card"><h2>Critical Findings</h2><div class="stat orange" id="stat-critical">-</div></div>
    <div class="card"><h2>False Positives</h2><div class="stat green" id="stat-fp">-</div></div>
  </div>

  <div class="two-col">
    <div class="chart-card">
      <h2>Risk Trend</h2>
      <canvas id="trend-chart" height="200"></canvas>
    </div>
    <div class="chart-card">
      <h2>Severity Breakdown</h2>
      <canvas id="severity-chart" height="200"></canvas>
    </div>
  </div>

  <div class="chart-card">
    <h2>Top Recurring Vulnerabilities</h2>
    <table id="recurring-table">
      <thead><tr><th>Rule</th><th>Title</th><th>Occurrences</th><th>Max Risk</th><th>Scans</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="chart-card">
    <h2>Scan History</h2>
    <table id="scans-table">
      <thead><tr><th>Date</th><th>Source</th><th>Findings</th><th>Actionable</th><th>Max Risk</th><th>FPs</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const COLORS = { accent: '#8b5cf6', red: '#ef4444', orange: '#f97316', green: '#22c55e', muted: '#71717a' };

function riskBadge(score) {
  const cls = score >= 7 ? 'risk-high' : score >= 4 ? 'risk-med' : 'risk-low';
  return `<span class="risk-badge ${cls}">${score}</span>`;
}

async function fetchJSON(url) {
  const res = await fetch(url);
  return res.json();
}

async function loadDashboard() {
  const [scans, trends, recurring, progress] = await Promise.all([
    fetchJSON('/api/scans'), fetchJSON('/api/trends'),
    fetchJSON('/api/recurring'), fetchJSON('/api/progress'),
  ]);

  // Stats
  document.getElementById('stat-scans').textContent = scans.length;
  document.getElementById('stat-max-risk').textContent = scans.length ? Math.max(...scans.map(s => s.max_risk)) : 0;
  document.getElementById('stat-critical').textContent = progress.critical || 0;
  document.getElementById('stat-fp').textContent = progress.false_positives || 0;

  // Trend chart
  if (trends.length) {
    new Chart(document.getElementById('trend-chart'), {
      type: 'line',
      data: {
        labels: trends.map(t => new Date(t.timestamp).toLocaleDateString()),
        datasets: [
          { label: 'Max Risk', data: trends.map(t => t.max_risk), borderColor: COLORS.red, backgroundColor: 'rgba(239,68,68,0.1)', fill: true, tension: 0.3 },
          { label: 'Avg Risk', data: trends.map(t => t.avg_risk), borderColor: COLORS.accent, backgroundColor: 'rgba(139,92,246,0.1)', fill: true, tension: 0.3 },
        ]
      },
      options: { responsive: true, scales: { y: { beginAtZero: true, max: 10, grid: { color: '#2a2d3a' }, ticks: { color: '#71717a' } }, x: { grid: { color: '#2a2d3a' }, ticks: { color: '#71717a' } } }, plugins: { legend: { labels: { color: '#e4e4e7' } } } }
    });
  }

  // Severity donut
  new Chart(document.getElementById('severity-chart'), {
    type: 'doughnut',
    data: {
      labels: ['Critical (7-10)', 'Medium (4-6)', 'Low (0-3)', 'False Positives'],
      datasets: [{ data: [progress.critical || 0, progress.medium || 0, progress.low || 0, progress.false_positives || 0], backgroundColor: [COLORS.red, COLORS.orange, COLORS.green, COLORS.muted] }]
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#e4e4e7', padding: 12 } } } }
  });

  // Recurring table
  const recurBody = document.querySelector('#recurring-table tbody');
  if (!recurring.length) {
    recurBody.innerHTML = '<tr><td colspan="5" class="empty">No data yet</td></tr>';
  } else {
    recurBody.innerHTML = recurring.map(r =>
      `<tr><td><code>${r.rule_id}</code></td><td>${r.title}</td><td>${r.occurrences}</td><td>${riskBadge(r.max_risk)}</td><td>${r.scan_count}</td></tr>`
    ).join('');
  }

  // Scans table
  const scansBody = document.querySelector('#scans-table tbody');
  if (!scans.length) {
    scansBody.innerHTML = '<tr><td colspan="6" class="empty">No scans yet. Run <code>vulnsift store --input report.json</code> to add data.</td></tr>';
  } else {
    scansBody.innerHTML = scans.map(s =>
      `<tr><td>${new Date(s.timestamp).toLocaleString()}</td><td>${s.source_file}</td><td>${s.total_findings}</td><td>${s.actionable_findings}</td><td>${riskBadge(s.max_risk)}</td><td>${s.false_positives}</td></tr>`
    ).join('');
  }
}

loadDashboard();
</script>
</body>
</html>
